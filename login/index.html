<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - FitBalance</title>

    <link rel="stylesheet" href="estilos.css" />

    <script>
      (function () {
        try {
          const temaGuardado =
            localStorage.getItem("modoAparienciaFitBalance") || "neon";

          if (temaGuardado === "oscuro") {
            document.documentElement.classList.add("modo-oscuro");
          } else if (temaGuardado === "neon") {
            document.documentElement.classList.add("modo-neon");
          }
        } catch (error) {
          // Default theme: neon
        }
      })();
    </script>
  </head>

  <body class="pagina-login">
    <a class="enlace-saltar" href="#contenidoPrincipal">Saltar al contenido</a>
    <main class="pantalla-auth" id="contenidoPrincipal">
      <section class="tarjeta-auth">

        <div class="encabezado-auth">
          <h1 class="titulo-auth">
            <span class="texto-azul">Fit</span><span class="texto-gris">Balance</span>
          </h1>
          <p class="subtitulo-auth" id="subtituloAuth">
            Inicia sesión para continuar con tu progreso
          </p>
        </div>

        <!-- LOGIN -->
        <div id="vistaLogin" class="vista-auth activa">
          <form id="formularioLogin" class="formulario-auth" novalidate>

            <div class="grupo-campo">
              <label for="correoLogin">Correo</label>
              <input
                type="email"
                id="correoLogin"
                name="correo"
                class="campo-formulario"
                placeholder="ejemplo@correo.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="grupo-campo">
              <label for="contrasenaLogin">Contraseña</label>
              <input
                type="password"
                id="contrasenaLogin"
                name="contrasena"
                class="campo-formulario"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
                minlength="6"
              />
            </div>

            <div class="opciones-auth">
              <label class="checkbox-recordar" for="recordarSesion">
                <input type="checkbox" id="recordarSesion" name="recordar" />
                <span>Recordarme</span>
              </label>

              <button type="button" class="link" id="abrirRecuperar">
                ¿Olvidaste tu contraseña?
              </button>
            </div>

            <p id="mensajeLogin" class="mensaje-formulario" aria-live="polite"></p>

            <button type="submit" class="boton-principal" id="botonEntrar">
              Entrar
            </button>

            <div class="separador-auth">
              <span>Iniciar sesión con</span>
            </div>

            <div class="social-auth">
              <button type="button" class="boton-social" data-provider="Google">
                <span class="icono-social">G</span>
                Google
              </button>

              <button type="button" class="boton-social" data-provider="Facebook">
                <span class="icono-social">f</span>
                Facebook
              </button>
            </div>

            <p class="pie-auth">
              ¿No tienes cuenta?
              <button type="button" class="link fuerte" id="abrirRegistro">
                Regístrate
              </button>
            </p>

          </form>
        </div>

        <!-- REGISTRO -->
        <div id="vistaRegistro" class="vista-auth oculto">
          <form id="formularioRegistro" class="formulario-auth" novalidate>

            <div class="grupo-campo">
              <label for="nombreRegistro">Nombre</label>
              <input
                type="text"
                id="nombreRegistro"
                name="nombre"
                class="campo-formulario"
                placeholder="Ingresa tu nombre"
                autocomplete="name"
                required
              />
            </div>

            <div class="grupo-campo">
              <label for="correoRegistro">Correo</label>
              <input
                type="email"
                id="correoRegistro"
                name="correo"
                class="campo-formulario"
                placeholder="ejemplo@correo.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="grupo-campo">
              <label for="contrasenaRegistro">Contraseña</label>
              <input
                type="password"
                id="contrasenaRegistro"
                name="contrasena"
                class="campo-formulario"
                placeholder="Crea una contraseña"
                autocomplete="new-password"
                required
                minlength="6"
              />
            </div>

            <div class="grupo-campo">
              <label for="confirmarRegistro">Confirmar contraseña</label>
              <input
                type="password"
                id="confirmarRegistro"
                name="confirmarContrasena"
                class="campo-formulario"
                placeholder="Repite tu contraseña"
                autocomplete="new-password"
                required
                minlength="6"
              />
            </div>

            <p id="mensajeRegistro" class="mensaje-formulario" aria-live="polite"></p>

            <button type="submit" class="boton-principal">
              Crear cuenta
            </button>

            <p class="pie-auth">
              ¿Ya tienes cuenta?
              <button type="button" class="link fuerte" id="volverLoginDesdeRegistro">
                Inicia sesión
              </button>
            </p>

          </form>
        </div>

        <!-- RECUPERAR -->
        <div id="vistaRecuperar" class="vista-auth oculto">
          <form id="formularioRecuperar" class="formulario-auth" novalidate>

            <div class="grupo-campo">
              <label for="correoRecuperar">Correo</label>
              <input
                type="email"
                id="correoRecuperar"
                name="correo"
                class="campo-formulario"
                placeholder="Ingresa tu correo"
                autocomplete="email"
                required
              />
            </div>

            <p class="texto-ayuda-auth">
              En el prototipo solo se mostrará un mensaje de recuperación.
            </p>

            <p id="mensajeRecuperar" class="mensaje-formulario" aria-live="polite"></p>

            <button type="submit" class="boton-principal">
              Enviar enlace
            </button>

            <p class="pie-auth">
              <button type="button" class="link fuerte" id="volverLoginDesdeRecuperar">
                Volver al login
              </button>
            </p>

          </form>
        </div>

      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
